name: Stock V toolchain

# Builds and tests with an official V release installed by vlang/setup-v,
# alongside the pinned compiler fork used by ci.yml. This checks that Vaddy
# also works with an unmodified upstream compiler.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      v-version:
        description: 'V release to install (tag from vlang/v)'
        required: false
        default: '0.5.2'

permissions:
  contents: read

concurrency:
  group: setup-v-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-v:
    name: Stock V ${{ inputs.v-version || '0.5.2' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make pkg-config libssl-dev libre2-dev zlib1g-dev libnghttp2-dev libzstd-dev openssl python3 python3-venv

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf openssl@3 re2 nghttp2 zstd
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      # Only `version` is passed: the action installs the release build for the
      # runner it is executed on, so OS and arch follow the matrix. The pin
      # mirrors V_VERSION in ci/toolchain.env, which pins the fork build.
      - name: Set up V
        id: v
        uses: vlang/setup-v@v1.7
        with:
          version: ${{ inputs.v-version || '0.5.2' }}
          cache: true

      - name: Show toolchain
        run: |
          v version
          echo "V binary: ${{ steps.v.outputs.v-bin-path }}"

      - name: Build and test
        run: |
          make V=v
          make test V=v VTESTFLAGS='-cc clang -gc boehm -d use_bundled_libgc'
          ./vaddy validate --config Caddyfile
          make integration V=v
          python3 -m venv .tools/http2-tests
          .tools/http2-tests/bin/pip install -r tests/requirements.txt
          make http2 V=v PYTHON=.tools/http2-tests/bin/python
          make encode V=v
          make files V=v
